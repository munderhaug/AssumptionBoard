name: Question
description: Something the team needs to understand before a decision
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        Write the title as the question itself, for example «How do bookkeepers find out which invoices are missing at month end?». Not an activity such as «Interview five bookkeepers».
        Fill in the first fields now. Leave «Current understanding» and «Informed bet» as they are until the card gets that far.
  - type: textarea
    id: why
    attributes:
      label: Why it matters
      description: What the question means, and which product, design, business or technical decision the answer could change.
    validations:
      required: true
  - type: textarea
    id: criterion
    attributes:
      label: What would be enough to update our understanding?
      description: What we would need to observe or establish to make a useful decision. Agree on it before anyone starts investigating.
  - type: textarea
    id: existing
    attributes:
      label: Existing material
      description: Links to anything that may already answer part of the question. Check before starting new research. Later, also links to where the investigation happens.
  - type: textarea
    id: understanding
    attributes:
      label: Current understanding
      description: Filled in before the weekly review in which the team decides to move the card to «What we currently know». In the review, rewrite the title as the understanding itself.
      value: |
        **What we found:** <!-- 1–3 sentences about users, work, domain, product or technology. Not about research progress. -->
        **So this means:** <!-- what it changes for the product or for our next decisions -->
        **Evidence and sources:** <!-- links to summaries in Miro, Figma, documents or code, with dates. No raw notes, recordings or names. -->
        **Applies to:** <!-- who and what the evidence represents, and where this may not apply -->
  - type: textarea
    id: bet
    attributes:
      label: Informed bet
      description: Filled in when the team proposes to proceed before the uncertainty is resolved. The team decides, usually in the weekly review. When the card moves, set the revisit date as Next checkpoint.
      value: |
        **We proceed with:** <!-- what we are choosing to do -->
        **Why it is reasonable now:**
        **If we are wrong:** <!-- the consequence -->
        **Revisit when:** <!-- a date, and optionally a trigger that brings it forward -->
  - type: textarea
    id: decisions
    attributes:
      label: Decisions informed
      description: Optional. Links to product, design or technical decisions this learning informs, for example org/app#456.
