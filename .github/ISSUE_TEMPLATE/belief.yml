name: Belief
description: Something the team believes but has not established
title: "We believe "
labels: ["belief"]
body:
  - type: markdown
    attributes:
      value: |
        Write one belief as the title, for example «We believe clients will upload invoices themselves if it takes less than a minute». One belief per card, concrete enough that evidence could challenge it.
        After you submit, move the card to «What we think we know» on the board. Leave the sections at the bottom as they are until the card gets there.
  - type: textarea
    id: why
    attributes:
      label: Why it matters
      description: Which product, design, business or technical decision rests on this belief, and what we lose if it is wrong.
    validations:
      required: true
  - type: textarea
    id: criterion
    attributes:
      label: What evidence would strengthen or challenge it?
      description: What we would need to observe to keep, refine or drop the belief. Agree on it before anyone starts investigating.
  - type: textarea
    id: existing
    attributes:
      label: Existing material and indications
      description: Optional. Links to what the belief rests on today, and to anything that may already answer it.
  - type: textarea
    id: understanding
    attributes:
      label: Current understanding
      description: Filled in when the card moves to «What we currently know». Then rewrite the title as the understanding itself and set Outcome.
      value: |
        **What we found:** <!-- 1–3 sentences about users, work, domain, product or technology. Not about research progress. -->
        **So this means:** <!-- what it changes for the product or for our next decisions -->
        **Evidence and sources:** <!-- links to summaries in Miro, Figma, documents or code, with dates. No raw notes, recordings or names. -->
        **Applies to:** <!-- who and what the evidence represents, and where this may not apply -->
  - type: textarea
    id: bet
    attributes:
      label: Informed bet
      description: Filled in only if the team decides to proceed before the belief is established.
      value: |
        **We proceed with:** <!-- what we are choosing to do -->
        **Why it is reasonable now:**
        **If we are wrong:** <!-- the consequence -->
        **Revisit when:** <!-- a date or a trigger -->
  - type: textarea
    id: decisions
    attributes:
      label: Decisions informed
      description: Optional. Links to product, design or technical decisions that rest on this belief, for example org/app#456.
